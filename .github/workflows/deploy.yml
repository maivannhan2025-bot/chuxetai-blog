name: Build & Deploy blog

# Mỗi khi có bài mới đẩy lên (kể cả bài do người viết lưu qua Pages CMS),
# GitHub tự build lại web Astro rồi đăng lên Cloudflare Pages.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9e88ac586803b53ffff66350dd0e375
          command: pages deploy dist --project-name=chuxetai-blog --branch=main
