name: Build & Deploy blog

# Mỗi khi có bài mới đẩy lên (kể cả bài do người viết lưu qua Pages CMS),
# GitHub tự build lại web Astro rồi đăng lên Cloudflare Pages.
on:
  push:
    branches: [main]
    paths-ignore: ['trang-chu/**', '.github/workflows/trang-chu.yml']   # sua trang chu khong can build lai blog
  workflow_dispatch: {}
  # Bai dat lich (ngayDang tuong lai) chi hien ra o lan build SAU dung ngay do
  # -> dung lai deu dan, khong thi bai dat lich nam mai trong kho khong bao gio len web.
  schedule:
    - cron: '5 * * * *'   # moi gio (phut 5): bai hen gio len web cham nhat 1 tieng sau gio hen

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      # Chup lai sitemap DANG live TRUOC khi deploy, de lat nua biet bai nao vua moi len.
      - name: Ghi nhớ sitemap đang live (để biết bài nào mới)
        run: node .github/bao-index.mjs ghi-nho

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9e88ac586803b53ffff66350dd0e375
          command: pages deploy dist --project-name=chuxetai-blog --branch=main

      # Bao cho Bing/Yandex/Naver/Seznam biet BAI VUA LEN CONG KHAI (IndexNow).
      # Chi bao URL moi hoac doi ngay — khong bao lai ca sitemap. Google KHONG dung
      # IndexNow: Google di theo sitemap + Search Console.
      - name: Báo index bài vừa lên công khai
        run: node .github/bao-index.mjs bao
