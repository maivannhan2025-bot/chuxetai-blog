name: Build & Deploy blog

# Mỗi khi có bài mới đẩy lên (kể cả bài do người viết lưu qua Pages CMS),
# GitHub tự build lại web Astro rồi đăng lên Cloudflare Pages.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9e88ac586803b53ffff66350dd0e375
          command: pages deploy dist --project-name=chuxetai-blog --branch=main

      # Báo cho Bing/Yandex... biết web vừa có bài mới, để họ mò lại sớm hơn
      # (IndexNow — không phục vụ Google, Google đi theo sitemap + Search Console).
      # Khoá này vốn phải công khai qua file .txt nên để thẳng đây, không phải bí mật.
      # LƯU Ý: chuxetai.com (gốc) là project MARKETING, chỉ /blog/* mới vào project này
      # → file khoá đặt ở /blog/ và IndexNow chỉ cho báo URL nằm trong /blog/.
      - name: Báo IndexNow (Bing/Yandex)
        run: |
          node -e "
            const fs = require('fs');
            const KEY = 'e9e6ba4dd32c595ce7dc0497b939d383d5af6e97';
            const HOST = 'chuxetai.com';
            const xml = fs.readFileSync('dist/blog/sitemap.xml', 'utf8');
            const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m => m[1])
                          .filter(u => u.startsWith('https://' + HOST + '/blog/'));
            fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify({ host: HOST, key: KEY, keyLocation: 'https://' + HOST + '/blog/' + KEY + '.txt', urlList: urls }),
            }).then(r => console.log('IndexNow trả về status:', r.status, '- số URL đã gửi:', urls.length))
              .catch(e => console.log('IndexNow lỗi (bỏ qua, không chặn deploy):', e.message));
          "
