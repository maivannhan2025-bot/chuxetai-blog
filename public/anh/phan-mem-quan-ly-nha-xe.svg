<svg viewBox="0 0 1200 620" width="1200" height="620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minh hoạ chọn phần mềm quản lý nhà xe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01093b"/>
      <stop offset="1" stop-color="#0a1550"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a34"/>
      <stop offset="1" stop-color="#eb3309"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="150" fill="#eb3309" opacity="0.10"/>
  <circle cx="150" cy="560" r="120" fill="#3b57d6" opacity="0.12"/>

  <!-- Brand chip -->
  <g transform="translate(70,52)">
    <rect width="40" height="40" rx="10" fill="url(#orange)"/>
    <text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">X</text>
    <text x="54" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff">chuxetai<tspan fill="#ff6a34">.com</tspan></text>
  </g>

  <!-- App window mockup -->
  <g filter="url(#soft)">
    <rect x="70" y="130" width="620" height="420" rx="22" fill="#0d1636" stroke="#26336a" stroke-width="1.5"/>
    <circle cx="100" cy="162" r="6" fill="#eb3309"/>
    <circle cx="122" cy="162" r="6" fill="#f0b429"/>
    <circle cx="144" cy="162" r="6" fill="#12833f"/>
    <text x="176" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#aeb8e0">Bảng điều khiển nhà xe</text>

    <!-- Stat tiles -->
    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="98" y="196" width="182" height="104" rx="14" fill="#101c44" stroke="#2a3a70" stroke-width="1"/>
      <text x="116" y="226" font-size="13" fill="#8b95c0">Lãi thật hôm nay</text>
      <text x="116" y="262" font-size="27" font-weight="800" fill="#ff6a34">3.18 tr</text>
      <text x="116" y="286" font-size="12" fill="#12c46a">▲ đã trừ đủ dầu, lương</text>

      <rect x="292" y="196" width="182" height="104" rx="14" fill="#101c44" stroke="#2a3a70" stroke-width="1"/>
      <text x="310" y="226" font-size="13" fill="#8b95c0">Chuyến đang chạy</text>
      <text x="310" y="262" font-size="27" font-weight="800" fill="#eef1fb">5</text>
      <text x="310" y="286" font-size="12" fill="#8b95c0">3 xe · 2 đối tác</text>

      <rect x="486" y="196" width="182" height="104" rx="14" fill="#101c44" stroke="#2a3a70" stroke-width="1"/>
      <text x="504" y="226" font-size="13" fill="#8b95c0">Công nợ khách</text>
      <text x="504" y="262" font-size="27" font-weight="800" fill="#eef1fb">42 tr</text>
      <text x="504" y="286" font-size="12" fill="#f0b429">2 khách tới hạn</text>
    </g>

    <!-- Mini bar chart -->
    <g transform="translate(98,326)">
      <rect x="0" y="0" width="570" height="196" rx="14" fill="#0b1637" stroke="#2a3a70" stroke-width="1"/>
      <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b95c0">Lãi theo tháng</text>
      <g fill="url(#orange)">
        <rect x="24" y="120" width="46" height="52" rx="6"/>
        <rect x="94" y="96" width="46" height="76" rx="6"/>
        <rect x="164" y="132" width="46" height="40" rx="6"/>
        <rect x="234" y="72" width="46" height="100" rx="6"/>
        <rect x="304" y="104" width="46" height="68" rx="6"/>
      </g>
      <g fill="#2f7cf6">
        <rect x="374" y="88" width="46" height="84" rx="6"/>
        <rect x="444" y="58" width="46" height="114" rx="6"/>
        <rect x="514" y="110" width="40" height="62" rx="6"/>
      </g>
    </g>
  </g>

  <!-- Checklist card -->
  <g filter="url(#soft)">
    <rect x="726" y="150" width="404" height="380" rx="20" fill="#0d1636" stroke="#26336a" stroke-width="1.5"/>
    <text x="754" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#eef1fb">Chọn sao cho đúng</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cdd5f0">
      <g transform="translate(754,228)">
        <circle cx="14" cy="10" r="14" fill="url(#orange)"/>
        <text x="14" y="15" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="42" y="15">Tính lãi lỗ tự động</text>
      </g>
      <g transform="translate(754,272)">
        <circle cx="14" cy="10" r="14" fill="url(#orange)"/>
        <text x="14" y="15" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="42" y="15">Quản công nợ khách &amp; đối tác</text>
      </g>
      <g transform="translate(754,316)">
        <circle cx="14" cy="10" r="14" fill="url(#orange)"/>
        <text x="14" y="15" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="42" y="15">Tính lương tài xế</text>
      </g>
      <g transform="translate(754,360)">
        <circle cx="14" cy="10" r="14" fill="url(#orange)"/>
        <text x="14" y="15" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="42" y="15">Dùng trên điện thoại</text>
      </g>
      <g transform="translate(754,404)">
        <circle cx="14" cy="10" r="14" fill="url(#orange)"/>
        <text x="14" y="15" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="42" y="15">Dữ liệu của mình, lấy ra được</text>
      </g>
      <g transform="translate(754,448)">
        <circle cx="14" cy="10" r="14" fill="url(#orange)"/>
        <text x="14" y="15" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="42" y="15">Có người Việt hỗ trợ</text>
      </g>
    </g>
  </g>
</svg>
