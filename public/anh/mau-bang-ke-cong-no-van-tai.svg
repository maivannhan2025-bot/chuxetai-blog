<svg viewBox="0 0 1200 680" width="1200" height="680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mẫu bảng kê công nợ vận tải gửi khách hàng tháng">
  <defs>
    <linearGradient id="bgk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01093b"/>
      <stop offset="1" stop-color="#0a1550"/>
    </linearGradient>
    <linearGradient id="orgk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a34"/>
      <stop offset="1" stop-color="#eb3309"/>
    </linearGradient>
    <filter id="softk" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgk)"/>
  <circle cx="1090" cy="100" r="160" fill="#eb3309" opacity="0.10"/>
  <circle cx="120" cy="600" r="130" fill="#3b57d6" opacity="0.12"/>

  <g transform="translate(80,54)">
    <rect width="40" height="40" rx="10" fill="url(#orgk)"/>
    <text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">X</text>
    <text x="54" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff">chuxetai<tspan fill="#ff6a34">.com</tspan></text>
  </g>

  <!-- Document card -->
  <g filter="url(#softk)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="150" y="120" width="900" height="500" rx="18" fill="#ffffff"/>
    <rect x="150" y="120" width="900" height="70" rx="18" fill="#01093b"/>
    <rect x="150" y="160" width="900" height="30" fill="#01093b"/>
    <text x="184" y="164" font-size="20" font-weight="800" fill="#ffffff">BẢNG KÊ CÔNG NỢ THÁNG 7/2026</text>
    <text x="1016" y="164" font-size="14" font-weight="600" fill="#aeb8e0" text-anchor="end">Khách: Cty Vincons</text>

    <!-- Table header -->
    <text x="184" y="228" font-size="14" font-weight="800" fill="#0b1233">Ngày</text>
    <text x="300" y="228" font-size="14" font-weight="800" fill="#0b1233">Chuyến</text>
    <text x="720" y="228" font-size="14" font-weight="800" fill="#0b1233" text-anchor="end">Cước</text>
    <text x="880" y="228" font-size="14" font-weight="800" fill="#0b1233" text-anchor="end">Đã thu</text>
    <text x="1016" y="228" font-size="14" font-weight="800" fill="#0b1233" text-anchor="end">Còn nợ</text>
    <line x1="184" y1="244" x2="1016" y2="244" stroke="#e4e8f2" stroke-width="1.5"/>

    <g font-size="14.5" fill="#39416b">
      <text x="184" y="278">05/07</text>
      <text x="300" y="278">Sóng Thần → Đà Nẵng</text>
      <text x="720" y="278" text-anchor="end" font-variant-numeric="tabular-nums">12.500.000</text>
      <text x="880" y="278" text-anchor="end" font-variant-numeric="tabular-nums">0</text>
      <text x="1016" y="278" text-anchor="end" font-variant-numeric="tabular-nums" fill="#b02607" font-weight="700">12.500.000</text>
      <line x1="184" y1="296" x2="1016" y2="296" stroke="#eef1f8" stroke-width="1"/>

      <text x="184" y="330">12/07</text>
      <text x="300" y="330">Sóng Thần → Quy Nhơn</text>
      <text x="720" y="330" text-anchor="end" font-variant-numeric="tabular-nums">9.800.000</text>
      <text x="880" y="330" text-anchor="end" font-variant-numeric="tabular-nums">9.800.000</text>
      <text x="1016" y="330" text-anchor="end" font-variant-numeric="tabular-nums" fill="#12833f" font-weight="700">0</text>
      <line x1="184" y1="348" x2="1016" y2="348" stroke="#eef1f8" stroke-width="1"/>

      <text x="184" y="382">20/07</text>
      <text x="300" y="382">Sóng Thần → Huế</text>
      <text x="720" y="382" text-anchor="end" font-variant-numeric="tabular-nums">8.200.000</text>
      <text x="880" y="382" text-anchor="end" font-variant-numeric="tabular-nums">0</text>
      <text x="1016" y="382" text-anchor="end" font-variant-numeric="tabular-nums" fill="#b02607" font-weight="700">8.200.000</text>
      <line x1="184" y1="400" x2="1016" y2="400" stroke="#eef1f8" stroke-width="1"/>

      <text x="184" y="434">27/07</text>
      <text x="300" y="434">Sóng Thần → Tam Kỳ</text>
      <text x="720" y="434" text-anchor="end" font-variant-numeric="tabular-nums">6.500.000</text>
      <text x="880" y="434" text-anchor="end" font-variant-numeric="tabular-nums">0</text>
      <text x="1016" y="434" text-anchor="end" font-variant-numeric="tabular-nums" fill="#b02607" font-weight="700">6.500.000</text>
    </g>

    <!-- Total row -->
    <rect x="168" y="456" width="864" height="52" rx="10" fill="#fff1ec"/>
    <text x="184" y="489" font-size="15" font-weight="800" fill="#0b1233">TỔNG CỘNG</text>
    <text x="720" y="489" font-size="15" font-weight="800" fill="#0b1233" text-anchor="end" font-variant-numeric="tabular-nums">37.000.000</text>
    <text x="880" y="489" font-size="15" font-weight="800" fill="#0b1233" text-anchor="end" font-variant-numeric="tabular-nums">9.800.000</text>
    <text x="1016" y="489" font-size="16" font-weight="800" fill="#b02607" text-anchor="end" font-variant-numeric="tabular-nums">27.200.000</text>

    <text x="184" y="545" font-size="13.5" fill="#68708e">Tổng cước − Đã thu = Còn nợ. Gửi khách đều đặn mỗi tháng để tiền về đúng hẹn.</text>

    <!-- Send button -->
    <rect x="184" y="565" width="190" height="40" rx="10" fill="url(#orgk)"/>
    <text x="279" y="590" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle">Gửi khách qua Zalo</text>
    <text x="1016" y="590" font-size="12.5" fill="#9aa2c4" text-anchor="end">Tạo tự động từ chuxetai.com</text>
  </g>
</svg>
