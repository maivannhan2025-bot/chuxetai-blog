<svg viewBox="0 0 1200 560" width="1200" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="So sánh ghi tay và phần mềm quản lý nhà xe">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#01093b"/>
      <stop offset="1" stop-color="#0a1550"/>
    </linearGradient>
    <linearGradient id="orange2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a34"/>
      <stop offset="1" stop-color="#eb3309"/>
    </linearGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bg2)"/>

  <text x="600" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#eef1fb" text-anchor="middle">Ghi tay có được không? Được — nhưng phải đều tay</text>

  <!-- Left: ghi tay -->
  <g filter="url(#soft2)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="90" y="120" width="470" height="380" rx="20" fill="#0d1636" stroke="#26336a" stroke-width="1.5"/>
    <text x="120" y="168" font-size="20" font-weight="800" fill="#aeb8e0">Sổ tay / Excel</text>
    <g font-size="16" fill="#cdd5f0">
      <g transform="translate(120,206)">
        <circle cx="13" cy="9" r="13" fill="#33406e"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#ff8a6a" text-anchor="middle">✕</text>
        <text x="40" y="14">Quên trừ một khoản là lãi ảo</text>
      </g>
      <g transform="translate(120,254)">
        <circle cx="13" cy="9" r="13" fill="#33406e"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#ff8a6a" text-anchor="middle">✕</text>
        <text x="40" y="14">Ghi dồn cuối tháng, sai số</text>
      </g>
      <g transform="translate(120,302)">
        <circle cx="13" cy="9" r="13" fill="#33406e"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#ff8a6a" text-anchor="middle">✕</text>
        <text x="40" y="14">Không rõ ai nợ bao nhiêu</text>
      </g>
      <g transform="translate(120,350)">
        <circle cx="13" cy="9" r="13" fill="#33406e"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#ff8a6a" text-anchor="middle">✕</text>
        <text x="40" y="14">Mất sổ là mất hết dữ liệu</text>
      </g>
      <g transform="translate(120,398)">
        <circle cx="13" cy="9" r="13" fill="#33406e"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#ff8a6a" text-anchor="middle">✕</text>
        <text x="40" y="14">Tài xế, kế toán khó xem chung</text>
      </g>
    </g>
  </g>

  <!-- VS badge -->
  <circle cx="600" cy="310" r="34" fill="url(#orange2)"/>
  <text x="600" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">VS</text>

  <!-- Right: phan mem -->
  <g filter="url(#soft2)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="640" y="120" width="470" height="380" rx="20" fill="#0d1636" stroke="#3a2a12" stroke-width="1.5"/>
    <text x="670" y="168" font-size="20" font-weight="800" fill="#ff8a4d">Phần mềm quản lý nhà xe</text>
    <g font-size="16" fill="#e6ebff">
      <g transform="translate(670,206)">
        <circle cx="13" cy="9" r="13" fill="url(#orange2)"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="40" y="14">Tự trừ đủ, ra lãi thật từng chuyến</text>
      </g>
      <g transform="translate(670,254)">
        <circle cx="13" cy="9" r="13" fill="url(#orange2)"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="40" y="14">Nhập tới đâu chốt tới đó</text>
      </g>
      <g transform="translate(670,302)">
        <circle cx="13" cy="9" r="13" fill="url(#orange2)"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="40" y="14">Công nợ hiện rõ từng người</text>
      </g>
      <g transform="translate(670,350)">
        <circle cx="13" cy="9" r="13" fill="url(#orange2)"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="40" y="14">Lưu đám mây, không lo mất</text>
      </g>
      <g transform="translate(670,398)">
        <circle cx="13" cy="9" r="13" fill="url(#orange2)"/>
        <text x="13" y="14" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
        <text x="40" y="14">Chủ, kế toán, tài xế xem đúng phần mình</text>
      </g>
    </g>
  </g>
</svg>
